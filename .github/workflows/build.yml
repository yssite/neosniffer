name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install llvm-mingw 20.x
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "NeoSniffer-CI" }
          if ($env:GH_TOKEN) { $headers["Authorization"] = "Bearer $($env:GH_TOKEN)" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/mstorsjo/llvm-mingw/releases?per_page=15" -Headers $headers
          $asset = $null
          foreach ($rel in $releases) {
            if ($rel.name -match "20\." -or $rel.body -match "LLVM 20\.") {
              $asset = $rel.assets | Where-Object { $_.name -match "ucrt-x86_64\.zip$" } | Select-Object -First 1
              if ($asset) { break }
            }
          }
          if (-not $asset) {
            $asset = $releases[0].assets | Where-Object { $_.name -match "ucrt-x86_64\.zip$" } | Select-Object -First 1
          }
          if (-not $asset) { throw "Could not find llvm-mingw ucrt-x86_64.zip asset" }
          Write-Host "Downloading $($asset.name)..."
          $zipPath = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $binDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName "bin" }
          if (-not (Test-Path $binDir)) { throw "llvm-mingw bin directory not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          Write-Host "Added $binDir to PATH"

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang++ --version
          x86_64-w64-mingw32-windres --version

      - name: Build x64 and run unit tests
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File build.ps1 -Target x64 -Test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neosniffer-win-x64
          path: |
            out/NeoSniffer.exe
            out/NeoSniffer.Mcp.exe
