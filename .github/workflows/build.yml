name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install llvm-mingw 20.1.2
        shell: pwsh
        env:
          LLVM_MINGW_RELEASE: "20250402"
        run: |
          $ErrorActionPreference = "Stop"
          $release = $env:LLVM_MINGW_RELEASE
          $archive = "llvm-mingw-${release}-ucrt-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/$archive" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $binDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName "bin" }
          if (-not (Test-Path $binDir)) { throw "llvm-mingw bin directory not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          Write-Host "Added $binDir to PATH"

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang++ --version
          x86_64-w64-mingw32-windres --version

      - name: Build x64 and run unit tests
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File build.ps1 -Target x64 -Test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neosniffer-win-x64
          path: |
            out/NeoSniffer.exe
            out/NeoSniffer.Mcp.exe
